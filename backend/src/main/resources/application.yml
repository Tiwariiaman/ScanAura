spring:
  application:
    name: ScanAura

  datasource:
    url: jdbc:postgresql://localhost:5432/scanaura
    username: postgres
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update

    show-sql: true

    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: false
    baseline-on-migrate: true


  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 2MB

server:
  port: 8080


jwt:
    secret: ${JWT_SECRET}
    expiration: 86400000

