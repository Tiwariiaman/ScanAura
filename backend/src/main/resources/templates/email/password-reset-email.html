<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset your ScanAura password</title>
</head>
<body style="margin:0;padding:0;background:#f5f7f9;font-family:Arial,Helvetica,sans-serif;color:#172026;">
<table width="100%" cellpadding="0" cellspacing="0" style="background:#f5f7f9;padding:40px 16px;">
    <tr>
        <td align="center">
            <table width="100%" cellpadding="0" cellspacing="0"
                   style="max-width:560px;background:#ffffff;border-radius:20px;overflow:hidden;">
                <tr>
                    <td align="center" style="padding:32px 24px 20px;">
                        <img th:src="${logoUrl}"
                             alt="ScanAura"
                             width="72"
                             style="display:block;width:72px;height:auto;">
                    </td>
                </tr>

                <tr>
                    <td style="padding:8px 32px 32px;text-align:center;">
                        <h1 style="margin:0 0 12px;font-size:28px;line-height:1.2;">
                            Reset your password
                        </h1>

                        <p style="margin:0 0 10px;font-size:17px;line-height:1.6;">
                            Hello <span th:text="${recipientName}">there</span>,
                        </p>

                        <p style="margin:0 0 26px;font-size:15px;line-height:1.7;color:#66727b;">
                            We received a request to reset your ScanAura password.
                        </p>

                        <a th:href="${resetUrl}"
                           style="display:inline-block;padding:14px 26px;background:#00674F;color:#ffffff;text-decoration:none;border-radius:12px;font-size:15px;font-weight:700;">
                            Reset Password
                        </a>

                        <p style="margin:26px 0 0;font-size:13px;line-height:1.6;color:#89939b;">
                            This link expires in 30 minutes and can only be used once.
                        </p>

                        <p style="margin:18px 0 0;font-size:13px;line-height:1.6;color:#89939b;">
                            If you did not request this, you can safely ignore this email.
                        </p>
                    </td>
                </tr>

                <tr>
                    <td style="padding:20px 24px;background:#f8faf9;text-align:center;">
                        <p style="margin:0;font-size:13px;color:#66727b;font-weight:700;">
                            Scan. View. Pay.
                        </p>
                        <p style="margin:6px 0 0;font-size:12px;color:#9aa3a9;">
                            ScanAura
                        </p>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
