<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${previewTitle}">Business | ScanAura</title>
    <meta name="description" th:content="${previewDescription}">
    <!-- Social crawlers read these server-rendered tags before the browser redirects. -->
    <meta property="og:title" th:content="${previewTitle}">
    <meta property="og:description" th:content="${previewDescription}">
    <meta property="og:type" content="website">
    <meta property="og:url" th:content="${canonicalUrl}">
    <meta property="og:site_name" content="ScanAura">
    <meta th:if="${previewImageUrl != null and !#strings.isEmpty(previewImageUrl)}" property="og:image" th:content="${previewImageUrl}">
    <meta th:if="${previewImageUrl != null and !#strings.isEmpty(previewImageUrl)}" property="og:image:alt" th:content="${previewTitle}">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" th:content="${previewTitle}">
    <meta name="twitter:description" th:content="${previewDescription}">
    <meta th:if="${previewImageUrl != null and !#strings.isEmpty(previewImageUrl)}" name="twitter:image" th:content="${previewImageUrl}">
    <link rel="canonical" th:href="${canonicalUrl}">
    <meta http-equiv="refresh" th:content="|0;url=${redirectUrl}|">
</head>
<body>
<main style="min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:Arial,sans-serif;text-align:center;padding:24px;box-sizing:border-box">
    <div>
        <img th:if="${previewImageUrl != null and !#strings.isEmpty(previewImageUrl)}" th:src="${previewImageUrl}" th:alt="${previewTitle}" style="max-width:120px;max-height:120px;object-fit:contain;border-radius:16px;margin-bottom:20px">
        <h1 th:text="${previewTitle}" style="margin:0 0 12px">Business | ScanAura</h1>
        <p th:text="${previewDescription}" style="color:#66727b">Explore this business on ScanAura.</p>
        <p><a th:href="${redirectUrl}">Open business page</a></p>
        <p style="color:#9aa3a9;font-size:13px">Powered by ScanAura</p>
    </div>
</main>
</body>
</html>
