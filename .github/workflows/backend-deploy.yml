name: Deploy Backend to EC2

on:
  push:
    branches:
      - master
    paths:
      - "backend/**"
      - ".github/workflows/backend-deploy.yml"

  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy backend to EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script_stop: true
          script: |
            set -e

            cd /opt/scanaura/backend/backend

            echo "Pulling latest backend code..."
            git fetch origin master
            git reset --hard origin/master

            echo "Building Spring Boot backend..."
            chmod +x mvnw
            ./mvnw clean package -DskipTests

            echo "Checking JAR..."
            test -f target/scanaura-0.0.1-SNAPSHOT.jar

            echo "Restarting ScanAura..."
            sudo systemctl restart scanaura

            echo "Checking service..."
            sudo systemctl is-active --quiet scanaura

            echo "Waiting for application..."
            sleep 5

            echo "Checking local API..."
            curl --fail --silent --show-error \
              http://localhost:8080 > /dev/null

            echo "Backend deployment successful."