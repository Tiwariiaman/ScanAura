name: Deploy Backend to EC2

on:
  push:
    branches:
      - master
    paths:
      - "backend/**"
      - ".github/workflows/backend-deploy.yml"

  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Deploy backend
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "Starting ScanAura backend deployment"
          echo "======================================"

          cd /opt/scanaura/backend/backend

          echo "Pulling latest code..."
          git fetch origin master
          git reset --hard origin/master

          echo "Making Maven wrapper executable..."
          chmod +x mvnw

          echo "Building Spring Boot application..."
          MAVEN_OPTS="-Xmx512m -XX:MaxMetaspaceSize=256m" ./mvnw clean package -DskipTests

          echo "Checking generated JAR..."
          test -f target/scanaura-0.0.1-SNAPSHOT.jar

          echo "Restarting ScanAura backend..."
          sudo systemctl restart scanaura

          echo "Checking systemd service..."
          sudo systemctl is-active --quiet scanaura

          echo "Waiting for Spring Boot..."
          sleep 5

          echo "Checking local API..."
          curl --fail --silent --show-error \
            http://localhost:8080 > /dev/null

          echo "======================================"
          echo "ScanAura backend deployment successful"
          echo "======================================"